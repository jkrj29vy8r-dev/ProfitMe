  </style>

  <div
    id="root"
    data-composition-id="01-gap"
    data-start="0"
    data-duration="5.6"
    data-width="1920"
    data-height="1080"
  >
    <div
      class="clip gap-ground"
      id="f01-gap-gap-ground"
      data-start="0"
      data-duration="5.6"
      data-track-index="0"
    ></div>

    <div
      class="clip gap-eyebrow"
      id="f01-gap-eyebrow"
      data-start="0"

    >

    <div
      class="clip gap-head gap-head-a"

    <div
      class="clip gap-cards"
      id="f01-gap-gap-cards"
      data-start="0"
      data-duration="5.6"
      data-track-index="5"
    >
      <div class="gap-card" id="f01-gap-card-a">
        <div class="gap-card-label">Reported revenue</div>
        <div class="gap-card-value" id="f01-gap-value-a">€0</div>
        <div class="gap-card-note">The number that gets celebrated.</div>
      </div>
      <div class="gap-card gap-card-lead" id="f01-gap-card-b">
        <div class="gap-card-label">Actual contribution</div>
        <div class="gap-card-value" id="f01-gap-value-b">€0</div>
        <div class="gap-card-note">The number that decides next year.</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var ENTRY = "power3.out";

      // Grouped by hand rather than via toLocaleString: locale data is not
      // guaranteed identical on the render machine, and the renderer seeks
      // frame-by-frame, so the digits must be a pure function of position.
      function group(n) {
        var s = String(n);
        var out = "";
        for (var i = 0; i < s.length; i++) {
          if (i > 0 && (s.length - i) % 3 === 0) out += ",";
          out += s[i];
        }
        return out;
      }

      function euro(el, to) {
        var box = { v: 0 };
        return gsap.to(box, {
          v: to,
          duration: 1.0,
          ease: "power2.out",
          onUpdate: function () {
            el.textContent = "€" + group(Math.round(box.v));
          },
        });
      }

      // Scene 1 (0.0-1.2s) — eyebrow, then the first headline line. Hero is
      // legible well before 0.5s; reveals resolve in place, never slide.
      tl.fromTo(
        "#f01-gap-eyebrow",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: ENTRY },
        0.0
      );
      tl.fromTo(
        "#f01-gap-head-a",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: ENTRY },
        0.12
      );

      // Scene 2 (1.2-2.4s) — the reported figure counts up once.
      tl.fromTo(
        "#f01-gap-card-a",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: ENTRY },
        1.15
      );
      tl.add(euro(document.getElementById("f01-gap-value-a"), 1840000), 1.35);

      // Scene 3 (2.4-3.4s) — the second line lands, and with it the figure
      // that actually matters. Same size, same tabular column: the digit
      // count is the argument, not a size trick.
      tl.fromTo(
        "#f01-gap-head-b",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: ENTRY },
        2.35
      );
      tl.fromTo(
        "#f01-gap-card-b",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: ENTRY },
        2.55
      );
      tl.add(euro(document.getElementById("f01-gap-value-b"), 312000), 2.75);

      // Scene 4 (3.4-5.0s) — the rule draws between claim and evidence, then
      // the frame holds. No exit: the root transition owns that.
      tl.fromTo(
        "#f01-gap-rule",
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, duration: 0.85, ease: "power3.inOut" },
        3.45
      );

      window.__timelines["01-gap"] = tl;
    })();
  </script>
