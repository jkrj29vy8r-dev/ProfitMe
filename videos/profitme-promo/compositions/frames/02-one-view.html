  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var ENTRY = "power3.out";

      function group(n) {
        var s = String(n);
        var out = "";
        for (var i = 0; i < s.length; i++) {
          if (i > 0 && (s.length - i) % 3 === 0) out += ",";
          out += s[i];
        }
        return out;
      }

      function countTo(sel, to, fmt) {
        var el = document.querySelector('[data-val="' + sel + '"]');
        var box = { v: 0 };
        return gsap.to(box, {
          v: to,
          duration: 0.9,
          ease: "power2.out",
          onUpdate: function () {
            el.textContent = fmt(box.v);
          },
        });
      }

      var tiles = [
        "#f02-one-view-tile-1",
        "#f02-one-view-tile-2",
        "#f02-one-view-tile-3",
        "#f02-one-view-tile-4",
      ];

      // Scene 1 (0.0-0.8s) — eyebrow + title resolve in place.
      tl.fromTo(
        "#f02-one-view-eyebrow",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: ENTRY },
        0.0
      );
      tl.fromTo(
        "#f02-one-view-title",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: ENTRY },
        0.1
      );

      // Scene 2 (0.8-1.6s) — tile shells and their labels cascade at 40ms.
      // Shell and label first: the design system's assembly order puts chrome
      // and labels ahead of the figures they carry.
      tiles.forEach(function (t, i) {
        tl.fromTo(
          t,
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: ENTRY },
          0.85 + i * 0.04
        );
        tl.fromTo(
          t + " .ov-tile-label",
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: ENTRY },
          0.9 + i * 0.04
        );
      });

      // Scene 3 (1.6-2.6s) — the headline numbers arrive. These are what the
      // viewer came for, so they land before any geometry.
      tl.add(
        countTo("02-one-view-v1", 184200, function (v) {
          return "€" + group(Math.round(v));
        }),
        1.6
      );
      tl.add(
        countTo("02-one-view-v2", 42.8, function (v) {
          return v.toFixed(1) + "%";
        }),
        1.72
      );
      tl.add(
        countTo("02-one-view-v3", 31240, function (v) {
          return "€" + group(Math.round(v));
        }),
        1.84
      );
      tl.add(
        countTo("02-one-view-v4", 38, function (v) {
          return Math.round(v) + " days";
        }),
        1.96
      );

      // Scene 4 (2.6-4.0s) — the trend panel, then the line draws, then the
      // deltas last. Every delta carries an arrow and a word, so none of them
      // depends on hue alone to be read.
      tl.fromTo(
        "#f02-one-view-panel",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: ENTRY },
        2.6
      );

      var line = document.getElementById("f02-one-view-line");
      var len = line.getTotalLength();
      line.style.strokeDasharray = len;
      tl.fromTo(
        line,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 1.25, ease: "power2.inOut" },
        2.85
      );

      ["d1", "d2", "d3", "d4"].forEach(function (d, i) {
        tl.fromTo(
          '[data-delta="02-one-view-' + d + '"]',
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: ENTRY },
          3.5 + i * 0.04
        );
      });

      // Scene 5 (4.0-5.0s) — hold on the assembled module. No exit tween.
      window.__timelines["02-one-view"] = tl;
    })();
  </script>
