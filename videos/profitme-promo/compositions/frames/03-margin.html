  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var ENTRY = "power3.out";

      function group(n) {
        var s = String(n);
        var out = "";
        for (var i = 0; i < s.length; i++) {
          if (i > 0 && (s.length - i) % 3 === 0) out += ",";
          out += s[i];
        }
        return out;
      }

      // Scene 1 (0.0-0.8s) — eyebrow + title.
      tl.fromTo(
        "#f03-margin-eyebrow",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: ENTRY },
        0.0
      );
      tl.fromTo(
        "#f03-margin-title",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: ENTRY },
        0.1
      );

      // Scene 2 (0.8-1.4s) — the figure the whole frame spends down.
      tl.fromTo(
        ["#f03-margin-lead-label", "#f03-margin-lead-value"],
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: ENTRY, stagger: 0.04 },
        0.85
      );
      tl.fromTo(
        "#f03-margin-bar",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: ENTRY },
        1.05
      );

      // Scene 3 (1.4-3.6s) — five deductions grow from zero in cascade. Each
      // segment is absolutely placed and scales on its own origin, so a bar
      // landing never shifts its neighbours. The lead figure steps down with
      // each one — it tweens to the new value, never re-grows from zero.
      // The label hands over as the descent starts: "Revenue" is only true of
      // the opening figure, and leaving it above a shrinking number would put
      // a false statement on screen.
      tl.set("#f03-margin-lab-rem", { opacity: 0 }, 0);
      tl.to("#f03-margin-lab-rev", { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.35);
      tl.fromTo(
        "#f03-margin-lab-rem",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: ENTRY },
        1.45
      );

      var costs = [92300, 14800, 9600, 21400, 14860];
      var running = 184200;
      for (var i = 0; i < 5; i++) {
        var at = 1.45 + i * 0.34;
        tl.fromTo(
          "#f03-margin-s" + i,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.42, ease: "power2.out" },
          at
        );
        tl.fromTo(
          "#f03-margin-l" + i,
          { opacity: 0 },
          { opacity: 1, duration: 0.32, ease: ENTRY },
          at + 0.06
        );

        (function (from, to) {
          var box = { v: from };
          tl.add(
            gsap.to(box, {
              v: to,
              duration: 0.34,
              ease: "power1.inOut",
              onUpdate: function () {
                document.getElementById("f03-margin-lead-value").textContent =
                  "€" + group(Math.round(box.v));
              },
            }),
            at + 0.1
          );
        })(running, running - costs[i]);
        running -= costs[i];
      }

      // Scene 4 (3.6-4.6s) — what survives, in copper.
      tl.fromTo(
        "#f03-margin-s5",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        3.62
      );
      tl.fromTo(
        "#f03-margin-out",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: ENTRY },
        3.8
      );

      // Scene 5 (4.6-5.5s) — hold. No exit tween.
      window.__timelines["03-margin"] = tl;
    })();
