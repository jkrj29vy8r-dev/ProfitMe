<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FBFAF8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-gap"
        class="scene"
        data-composition-id="01-gap"
        data-composition-src="compositions/frames/01-gap.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-02-one-view"
        class="scene"
        data-composition-id="02-one-view"
        data-composition-src="compositions/frames/02-one-view.html"
        data-start="5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-margin"
        class="scene"
        data-composition-id="03-margin"
        data-composition-src="compositions/frames/03-margin.html"
        data-start="10"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-04-cash"
        class="scene"
        data-composition-id="04-cash"
        data-composition-src="compositions/frames/04-cash.html"
        data-start="15.5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-signals"
        class="scene"
        data-composition-id="05-signals"
        data-composition-src="compositions/frames/05-signals.html"
        data-start="20.5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-06-close"
        class="scene"
        data-composition-id="06-close"
        data-composition-src="compositions/frames/06-close.html"
        data-start="25.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
