<template>
  <style>
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }

    #root {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .gap-ground { position: absolute; inset: 0; background: #fbfaf8; }

    .gap-eyebrow {
      position: absolute; left: 72px; top: 212px;
      font-size: 23px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; color: #955823;
    }

    .gap-head {
      position: absolute; left: 72px; width: 936px;
      font-size: 74px; font-weight: 600; line-height: 1.0;
      letter-spacing: -0.035em; color: #231f1a;
    }
    .gap-head-a { top: 262px; }
    .gap-head-b { top: 344px; }

    .gap-rule {
      position: absolute; left: 72px; top: 500px;
      height: 4px; width: 936px; border-radius: 2px;
      background: #955823; transform-origin: left center;
    }

    .gap-card {
      position: absolute; left: 72px; width: 936px;
      padding: 40px 44px 42px;
      border-radius: 14px;
      border: 1.5px solid rgba(149, 88, 35, 0.2);
      background: rgba(149, 88, 35, 0.04);
    }
    .gap-card-a { top: 576px; }
    .gap-card-b {
      top: 916px;
      border-color: rgba(149, 88, 35, 0.42);
      background: rgba(149, 88, 35, 0.08);
    }

    .gap-card-label {
      font-size: 22px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; color: #6f675f; margin-bottom: 24px;
    }

    .gap-card-value {
      font-size: 96px; font-weight: 600; line-height: 1;
      letter-spacing: -0.025em; font-variant-numeric: tabular-nums;
      color: #231f1a;
    }
    .gap-card-b .gap-card-value { color: #955823; }

    .gap-card-note {
      margin-top: 22px; font-size: 27px; font-weight: 400;
      line-height: 1.45; color: #6f675f;
    }
  </style>

  <div id="root" data-composition-id="01-gap" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <div class="clip gap-ground" id="f01-gap-ground" data-start="0" data-duration="5" data-track-index="0"></div>

    <div class="clip gap-eyebrow" id="f01-gap-eyebrow" data-start="0" data-duration="5" data-track-index="1">
      Profit intelligence
    </div>

    <div class="clip gap-head gap-head-a" id="f01-gap-head-a" data-start="0" data-duration="5" data-track-index="2">
      Revenue is a headline.
    </div>

    <div class="clip gap-head gap-head-b" id="f01-gap-head-b" data-start="0" data-duration="5" data-track-index="3">
      Profit is the story.
    </div>

    <div class="clip gap-rule" id="f01-gap-rule" data-start="0" data-duration="5" data-track-index="4"></div>

    <div class="clip gap-card gap-card-a" id="f01-gap-card-a" data-start="0" data-duration="5" data-track-index="5">
      <div class="gap-card-label">Reported revenue</div>
      <div class="gap-card-value" id="f01-gap-value-a">€0</div>
      <div class="gap-card-note">The number that gets celebrated.</div>
    </div>

    <div class="clip gap-card gap-card-b" id="f01-gap-card-b" data-start="0" data-duration="5" data-track-index="6">
      <div class="gap-card-label">Actual contribution</div>
      <div class="gap-card-value" id="f01-gap-value-b">€0</div>
      <div class="gap-card-note">The number that decides next year.</div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var ENTRY = "power3.out";

      function group(n) {
        var s = String(n), out = "";
        for (var i = 0; i < s.length; i++) {
          if (i > 0 && (s.length - i) % 3 === 0) out += ",";
          out += s[i];
        }
        return out;
      }

      function euro(id, to) {
        var el = document.getElementById(id);
        var box = { v: 0 };
        return gsap.to(box, {
          v: to, duration: 1.0, ease: "power2.out",
          onUpdate: function () { el.textContent = "€" + group(Math.round(box.v)); },
        });
      }

      // Scene 1 (0.0-1.2s)
      tl.fromTo("#f01-gap-eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: ENTRY }, 0.0);
      tl.fromTo("#f01-gap-head-a", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: ENTRY }, 0.12);

      // Scene 2 (1.2-2.4s)
      tl.fromTo("#f01-gap-card-a", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: ENTRY }, 1.15);
      tl.add(euro("f01-gap-value-a", 1840000), 1.35);

      // Scene 3 (2.4-3.4s) — stacked, so the comparison is read as succession
      // rather than adjacency. Same type size, same tabular column.
      tl.fromTo("#f01-gap-head-b", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: ENTRY }, 2.35);
      tl.fromTo("#f01-gap-card-b", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: ENTRY }, 2.55);
      tl.add(euro("f01-gap-value-b", 312000), 2.75);

      // Scene 4 (3.4-5.0s)
      tl.fromTo("#f01-gap-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.85, ease: "power3.inOut" }, 3.45);

      window.__timelines["01-gap"] = tl;
    })();
  </script>
</template>
